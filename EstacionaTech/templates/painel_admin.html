<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EstacionaTech - Painel Administrativo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilo.css') }}">
</head>
<body>
    <div class="dashboard">
        <header class="dashboard-header">
            <nav class="dashboard-nav container">
                <h1 class="dashboard-title">EstacionaTech</h1>
                <div class="dashboard-user">
                    <span>Bem-vindo, {{ nome }}</span>
                    <a href="{{ url_for('auth.logout') }}" class="btn btn-primary">Sair</a>
                </div>
            </nav>
        </header>
        <main class="dashboard-content container">
            <h2>Painel Administrativo</h2>
            <div class="dashboard-grid">
                <div class="dashboard-card">
                    <h3>Gestão de Usuários</h3>
                    <p>Gerencie operadores e administradores do sistema</p>
                </div>
                <div class="dashboard-card">
                    <h3>Relatórios</h3>
                    <p>Visualize relatórios de ocupação e faturamento</p>
                </div>
                <a href="{{url_for('admin.configuracoes_admin')}}" class="dashboard-card">
                    <h3>Configurações</h3>
                    <p>Configure parâmetros do estacionamento</p>
                </a>
            </div>
        </main>
    </div>
</body>
</html>
