<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Administrador - EstacionaTech</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilo.css') }}">
</head>
<body>
    <div class="dashboard">
        <header class="dashboard-header">
            <nav class="dashboard-nav container">
                <h1 class="dashboard-title">EstacionaTech</h1>
                <div class="dashboard-user">
                    <span>{{ nome }}</span>
                    <a href="{{ url_for('auth.logout') }}" class="btn btn-primary">Sair</a>
                </div>
            </nav>
        </header>
        <main class="dashboard-content container">
            <h2>Painel do Administrador</h2>
            <div class="dashboard-grid">
                <div class="dashboard-card">
                    <h3>Configurações</h3>
                    <p>Configure setores, vagas, tarifas e operadores.</p>
                    <a href="{{ url_for('configadm.configuracoes_admin') }}" class="btn btn-primary">Acessar</a>
                </div>
                <div class="dashboard-card">
                    <h3>Relatórios</h3>
                    <p>Acesse relatórios sobre a operação do estacionamento.</p>
                    <a href="#" class="btn btn-primary">Em breve</a>
                </div>
                <div class="dashboard-card">
                    <h3>Clientes</h3>
                    <p>Gerencie os dados de clientes do estacionamento.</p>
                    <a href="{{ url_for('cliente.gerenciar_clientes') }}" class="btn btn-primary">Acessar</a>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
