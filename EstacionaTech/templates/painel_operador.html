<!DOCTYPE html>
<html lang="pt-BR">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>EstacionaTech - Painel do Operador</title>
   <link rel="stylesheet" href="{{ url_for('static', filename='css/estilo.css') }}">
</head>
<body>
   <div class="dashboard">
       <header class="dashboard-header">
           <nav class="dashboard-nav container">
               <h1 class="dashboard-title">EstacionaTech</h1>
               <div class="dashboard-user">
                   <span>Bem-vindo, {{ nome }}</span>
                   <a href="{{ url_for('auth.logout') }}" class="btn btn-primary">Sair</a>
               </div>
           </nav>
       </header>
       <main class="dashboard-content container">
           <h2>Painel do Operador</h2>
           <div class="dashboard-grid">
               <div class="dashboard-card">
                   <h3>Entrada de Veículos</h3>
                   <p>Registre a entrada de novos veículos</p>
               </div>
               <div class="dashboard-card">
                   <h3>Saída de Veículos</h3>
                   <p>Processe a saída e pagamento de veículos</p>
               </div>
               <div class="dashboard-card">
                   <h3>Vagas Disponíveis</h3>
                   <p>Visualize o status das vagas</p>
               </div>
           </div>
       </main>
   </div>
</body>
</html>
