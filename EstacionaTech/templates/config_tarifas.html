<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuração de Tarifas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tarifa.css') }}">
</head>
<body>

    <h1>Configuração de Tarifas</h1>

    <!-- Exibir mensagens de sucesso ou erro -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <p class="{{ category }}">{{ message }}</p>
            {% endfor %}
        {% endif %}
    {% endwith %}
    <form action="{{ url_for('tarifa.config_tarifas') }}" method="POST">
        <label for="valor_por_hora">Valor por hora (R$):</label>
        <input type="text" id="valor_por_hora" name="valor_por_hora" value="{{ tarifa[0] }}" required><br>

        <label for="tempo_tolerancia">Tempo de tolerância (minutos):</label>
        <input type="number" id="tempo_tolerancia" name="tempo_tolerancia" value="{{ tarifa[1] }}" required><br>

        <div class="button-group">
            <button type="submit">Salvar</button>
            <a href="{{ url_for('configadm.configuracoes_admin') }}" class="btn btn-secondary">Voltar</a>
        </div>
    </form>

</body>
</html>
