<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuração de Tarifas - EstacionaTech</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilo.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tarifa.css') }}">
</head>
<body>
    <div class="dashboard">
        <header class="dashboard-header">
            <nav class="dashboard-nav container">
                <h1 class="dashboard-title">EstacionaTech</h1>
                <div class="dashboard-user">
                    <span>{{ session.get('nome') }}</span>
                    <a href="{{ url_for('admin.configuracoes_admin') }}" class="btn btn-primary">Voltar as Configurações</a>
                    <a href="{{ url_for('auth.logout') }}" class="btn btn-primary">Sair</a>
                </div>
            </nav>
        </header>
        <main class="dashboard-content container">
            <h2>Configuração de Tarifas</h2>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <div class="dashboard-grid">
                <div class="dashboard-card">
                    <h3>Configurar Tarifas</h3>
                    <form action="{{ url_for('tarifa.config_tarifas') }}" method="POST" class="form">
                        <div class="form-group">
                            <label class="form-label" for="valor_por_hora">Valor por hora (R$):</label>
                            <input class="form-input" type="text" id="valor_por_hora" name="valor_por_hora" value="{{ tarifa[0] }}" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="tempo_tolerancia">Tempo de tolerância (minutos):</label>
                            <input class="form-input" type="number" id="tempo_tolerancia" name="tempo_tolerancia" value="{{ tarifa[1] }}" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Salvar</button>
                    </form>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
