<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatórios - EstacionaTech</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilo.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/relatorio.css') }}">
</head>
<body>
    <header class="dashboard-header">
        <nav class="dashboard-nav container">
            <h1 class="dashboard-title">EstacionaTech</h1>
            <div class="dashboard-user">
                <span>{{ nome }}</span>
                <a href="{{ url_for('admin.painel_admin') }}" class="btn btn-primary">Voltar ao Painel</a>
                <a href="{{ url_for('auth.logout') }}" class="btn btn-primary">Sair</a>
            </div>
        </nav>
    </header>

    <div class="content-area">
        <div class="form-container">
            <h1>Relatórios do Sistema</h1>

            <form method="POST" action="{{ url_for('relatorio.gerar_relatorios') }}">
                <div class="data-range">
                    <div class="data-field">
                        <label for="data_inicio">Data de Início:</label>
                        <input type="date" name="data_inicio" required>
                    </div>
                    <div class="data-field">
                        <label for="data_fim">Data de Fim:</label>
                        <input type="date" name="data_fim" required>
                    </div>
                </div>

                <div class="section">
                    <h2>Relatórios Operacionais</h2>
                    <button class="btn btn-primary" type="submit" name="tipo_relatorio" value="operacional_locacoes">
                        Relatório de Locações
                    </button>
                    <button class="btn btn-primary" type="submit" name="tipo_relatorio" value="operacional_geral">
                        Relatório Operacional Geral
                    </button>
                    <button class="btn btn-primary" type="submit" name="tipo_relatorio" value="operacional_clientes">
                        Relatório Operacional de Clientes
                    </button>
                </div>

                <div class="section">
                    <h2>Relatórios Financeiros</h2>
                    <button class="btn btn-primary" type="submit" name="tipo_relatorio" value="financeiro_geral">
                        Relatório Financeiro Geral
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
