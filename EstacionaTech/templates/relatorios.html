<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Relatórios - EstacionaTech</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
            background-color: #f4f4f4;
        }

        h1, h2 {
            color: #333;
        }

        .form-container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            max-width: 700px;
            margin: auto;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input[type="date"] {
            padding: 8px;
            width: 100%;
            margin-bottom: 15px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        .section {
            margin-top: 30px;
        }

        .btn {
            display: inline-block;
            margin: 10px 10px 0 0;
            padding: 10px 20px;
            background-color: #007bff;
            border: none;
            color: white;
            cursor: pointer;
            border-radius: 5px;
        }

        .btn:hover {
            background-color: #0056b3;
        }

        .user-info {
            text-align: right;
            margin-bottom: 10px;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <div class="user-info">
            Logado como: {{ nome }}
        </div>

        <h1>Relatórios do Sistema</h1>

        <form method="POST" action="{{ url_for('admin.relatorios') }}">
            <label for="data_inicio">Data de Início:</label>
            <input type="date" name="data_inicio" required>

            <label for="data_fim">Data de Fim:</label>
            <input type="date" name="data_fim" required>

            <div class="section">
                <h2>Relatórios Operacionais</h2>
                <button class="btn" type="submit" name="tipo_relatorio" value="operacional_ocupacao">
                    Ocupação de Vagas
                </button>
                <button class="btn" type="submit" name="tipo_relatorio" value="operacional_tempo_medio">
                    Tempo Médio de Permanência
                </button>
                <button class="btn" type="submit" name="tipo_relatorio" value="operacional_fluxo">
                    Fluxo de Veículos
                </button>
            </div>

            <div class="section">
                <h2>Relatórios Financeiros</h2>
                <button class="btn" type="submit" name="tipo_relatorio" value="financeiro_diario">
                    Faturamento Diário
                </button>
                <button class="btn" type="submit" name="tipo_relatorio" value="financeiro_total">
                    Faturamento Total
                </button>
            </div>
        </form>
    </div>

</body>
</html>
