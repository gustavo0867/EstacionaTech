<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EstacionaTech - Relatórios</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilo.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/relatorios.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>
<body>
    <div class="dashboard">
        <header class="dashboard-header">
            <nav class="dashboard-nav container">
                <h1 class="dashboard-title">EstacionaTech</h1>
                <div class="dashboard-user">
                    <span>{{ nome }}</span>
                    <a href="{{ url_for('admin.painel_admin') }}" class="btn btn-primary">Voltar ao Painel</a>
                    <a href="{{ url_for('auth.logout') }}" class="btn btn-primary">Sair</a>
                </div>
            </nav>
        </header>

        <main class="container">
            <section class="report-section">
                <div class="report-header">
                    <h2>Relatórios de Faturamento</h2>
                </div>

                <div class="report-form">
                    <div class="type-selector">
                        <div class="type-option">
                            <input type="radio" id="tipo-diario" name="tipo_relatorio" value="diario" checked>
                            <label for="tipo-diario">Diário</label>
                        </div>
                        <div class="type-option">
                            <input type="radio" id="tipo-mensal" name="tipo_relatorio" value="mensal">
                            <label for="tipo-mensal">Mensal</label>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="data_inicio">Data Inicial</label>
                            <input type="date" id="data_inicio" name="data_inicio" class="form-control" required>
                        </div>

                        <div class="form-group" id="data-fim-group">
                            <label for="data_fim">Data Final</label>
                            <input type="date" id="data_fim" name="data_fim" class="form-control">
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">
                            Gerar Relatório
                        </button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        // Inicializa datepickers
        flatpickr("#data_inicio", {
            dateFormat: "Y-m-d",
            maxDate: "today"
        });

        flatpickr("#data_fim", {
            dateFormat: "Y-m-d",
            maxDate: "today"
        });

        // Mostra/esconde data final conforme o tipo de relatório
        const tipoDiario = document.getElementById('tipo-diario');
        const dataFimGroup = document.getElementById('data-fim-group');

        function toggleDataFim() {
            if (tipoDiario.checked) {
                dataFimGroup.style.display = 'none';
                document.getElementById('data_fim').value = '';
            } else {
                dataFimGroup.style.display = 'block';
            }
        }

        document.querySelectorAll('input[name="tipo_relatorio"]').forEach(radio => {
            radio.addEventListener('change', toggleDataFim);
        });

        toggleDataFim(); // Executa no carregamento
    });
    </script>
</body>
</html>
