<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações de Setores - EstacionaTech</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilo.css') }}">
</head>
<body>
    <div class="dashboard">
        <header class="dashboard-header">
            <nav class="dashboard-nav container">
                <h1 class="dashboard-title">EstacionaTech</h1>
                <div class="dashboard-user">
                    <span>Bem-vindo, {{ nome }}</span>
                    <a href="{{ url_for('logout') }}" class="btn btn-primary">Sair</a>
                </div>
            </nav>
        </header>
        <main class="dashboard-content container">
            <h2>Configurações de Setores</h2>

            <div class="dashboard-grid">
                <div class="dashboard-card">
                    <h3>Adicionar Setor</h3>
                    <p>Crie um novo setor para organização do estacionamento.</p>
                    <a href="{{ url_for('') }}" class="btn btn-primary">Adicionar</a>
                </div>
            </div>

            <h3>Setores Atuais</h3>
            <table class="table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    {% for setor in setores %}
                    <tr>
                        <td>{{ setor.id }}</td>
                        <td>{{ setor.nome }}</td>
                        <td>
                            <a href="{{ url_for('configuracoes_admin', setor_id=setor.id) }}" class="btn btn-primary">Editar</a>
                            <a href="{{ url_for('configuracoes_admin', setor_id=setor.id) }}" class="btn btn-danger">Remover</a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>

        </main>
    </div>
</body>
</html>
